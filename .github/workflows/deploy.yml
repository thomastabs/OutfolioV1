name: Deploy Outfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-outfolio-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, test, and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Run test suite
        run: pnpm test

      - name: Build Next.js app
        run: pnpm build

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"remoteName":"origin","projects":[{"id":"%s","name":"outfolio-v1","directory":".","orgId":"%s"}]}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/repo.json

      - name: Pull Vercel production environment
        run: pnpm dlx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel production
        run: pnpm dlx vercel deploy --prod --token="$VERCEL_TOKEN"
