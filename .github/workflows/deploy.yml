name: Deploy Outfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
    # Apex's Phase 5 dispatch always sends these four inputs (environment,
    # plus three traceability fields when "Send Apex metadata inputs" is
    # checked) - GitHub rejects a dispatch carrying any input a workflow
    # has not declared, so they must all be listed here even though none
    # of the job steps below currently read them. Declared, not required:
    # a plain manual "Run workflow" click from the GitHub UI with nothing
    # filled in must still work.
    inputs:
      environment:
        description: "Target environment (informational only - this job always deploys to Vercel production)"
        required: false
        type: string
      story_id:
        description: "Apex story id this deployment traces back to"
        required: false
        type: string
      apex_project_id:
        description: "Apex project id this deployment traces back to"
        required: false
        type: string
      deploy_pack_hash:
        description: "Hash of the Apex deploy pack reviewed for this deployment"
        required: false
        type: string

concurrency:
  group: deploy-outfolio-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, test, and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: tomassantostaborda-8127s-projects
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Run test suite
        run: pnpm test

      - name: Build Next.js app
        run: pnpm build

      - name: Pull Vercel production environment
        run: pnpm dlx vercel pull --yes --environment=production --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm prisma migrate deploy

      - name: Deploy to Vercel production
        run: pnpm dlx vercel deploy --prod --yes --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
