name: E2E Tests

# Deliberately its own workflow, independent of deploy.yml: E2E failures
# must not block or slow the production deploy pipeline. Uses its own
# isolated Supabase project (TEST_* secrets) - never the production
# DATABASE_URL/SUPABASE_URL used by deploy.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-outfolio
  cancel-in-progress: true

jobs:
  e2e:
    name: Build, seed, and run Playwright E2E tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      NEXTAUTH_SECRET: ${{ secrets.TEST_NEXTAUTH_SECRET }}
      NEXTAUTH_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply migrations to the test database
        run: pnpm prisma migrate deploy

      - name: Reset and seed the test database
        run: pnpm seed:test-db

      - name: Build Next.js app
        run: pnpm build

      - name: Start the app server
        run: pnpm start &

      - name: Wait for the server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 -o /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready in time" >&2
          exit 1

      - name: Run Playwright E2E test suite
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
